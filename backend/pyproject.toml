[project]
name = "MyProject"
version = "2.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.2",
    "packaging>=26.3",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.16.2",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.33",
    "sqlmodel>=0.0.48",
]

[tool.setuptools]
packages = ["backend"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "prek>=0.5.10",
    "ruff>=0.17.4",
]

# ── Ruff (linter PEP8) ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Ruff — format ────────────────────────────────────────────────────────────
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── Mypy (type checking) ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
